name: Windows Telemetry S7 Acceptance

on:
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-telemetry-s7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-s7-acceptance:
    name: TELEMETRY_S7_ACCEPTANCE / Windows
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 60
    env:
      BUILD_DIR: ${{ runner.temp }}/cohavora-build/telemetry-s7
      COHAVORA_CI_DEPS_DIR: ${{ vars.COHAVORA_WINDOWS_DEPS_DIR }}
      CTEST_OUTPUT_ON_FAILURE: "1"
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Validate runner dependencies
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COHAVORA_CI_DEPS_DIR)) {
            throw 'Repository variable COHAVORA_WINDOWS_DEPS_DIR must point to the pre-provisioned deps directory.'
          }

          $deps = (Resolve-Path -LiteralPath $env:COHAVORA_CI_DEPS_DIR -ErrorAction Stop).Path
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          $workspacePrefix = $workspace.TrimEnd('\', '/') + [System.IO.Path]::DirectorySeparatorChar
          if ($deps.Equals($workspace, [System.StringComparison]::OrdinalIgnoreCase) -or
              $deps.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'COHAVORA_WINDOWS_DEPS_DIR must be outside GITHUB_WORKSPACE so checkout cleanup cannot delete it.'
          }

          $required = @(
            'webrtc/include/api/peer_connection_interface.h',
            'webrtc/lib/Debug/webrtc.lib',
            'Libraries/win64/Qt-5.15.18/lib/Qt5Core.lib',
            'Libraries/win64/Qt-5.15.18/plugins/platforms/qwindows.lib',
            'Libraries/win64/tg_angle/out/Release/tg_angle.lib'
          )
          foreach ($relative in $required) {
            $candidate = Join-Path $deps $relative
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "Required Windows CI dependency is missing: $candidate"
            }
          }

          $vcpkg = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkg) -and (Test-Path -LiteralPath 'C:\vcpkg')) {
            $vcpkg = 'C:\vcpkg'
          }
          if ([string]::IsNullOrWhiteSpace($vcpkg) -or
              -not (Test-Path -LiteralPath (Join-Path $vcpkg 'scripts/buildsystems/vcpkg.cmake') -PathType Leaf)) {
            throw 'VCPKG_ROOT must identify a vcpkg installation containing scripts/buildsystems/vcpkg.cmake.'
          }

          $ninja = Get-Command ninja.exe -ErrorAction SilentlyContinue
          if (-not $ninja -and -not [string]::IsNullOrWhiteSpace($env:VSINSTALLDIR)) {
            $candidate = Join-Path $env:VSINSTALLDIR 'Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              Split-Path -Parent $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $ninja = Get-Item -LiteralPath $candidate
            }
          }
          if (-not $ninja) {
            throw 'Ninja is required for the sccache-backed Windows build.'
          }

          "COHAVORA_RESOLVED_DEPS_DIR=$deps" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compute compiler cache identity
        id: compiler-cache-identity
        shell: pwsh
        run: |
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          $deps = (Resolve-Path -LiteralPath $env:COHAVORA_RESOLVED_DEPS_DIR).Path
          $cl = (Get-Command cl.exe -ErrorAction Stop).Source
          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          $vcpkgToolchain = Join-Path $env:VCPKG_ROOT 'scripts/buildsystems/vcpkg.cmake'

          $identity = @(
            'schema=1',
            'architecture=x64',
            'configuration=Debug',
            'msvc-runtime=MultiThreaded',
            "compiler=$cl|$((Get-Item -LiteralPath $cl).VersionInfo.FileVersion)",
            "cmake=$((& cmake --version | Select-Object -First 1).Trim())",
            "ninja=$((& $ninja --version | Select-Object -First 1).Trim())",
            "vcpkg-toolchain=$((Get-FileHash -Algorithm SHA256 -LiteralPath $vcpkgToolchain).Hash.ToLowerInvariant())",
            "vcpkg-manifest=$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $workspace 'vcpkg.json')).Hash.ToLowerInvariant())",
            "webrtc-debug=$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $deps 'webrtc/lib/Debug/webrtc.lib')).Hash.ToLowerInvariant())"
          )

          $requiredManifest = Join-Path $workspace 'build/prepare/libraries-required.txt'
          $requiredLibraries = Get-Content -LiteralPath $requiredManifest |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') }
          foreach ($relative in $requiredLibraries) {
            $path = Join-Path (Join-Path $deps 'Libraries/win64') $relative
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            $identity += "library=$relative|$hash"
          }

          $hasher = [System.Security.Cryptography.SHA256]::Create()
          try {
            $bytes = [System.Text.Encoding]::UTF8.GetBytes(($identity -join "`n"))
            $fingerprint = -join ($hasher.ComputeHash($bytes) |
              ForEach-Object { $_.ToString('x2') })
          } finally {
            $hasher.Dispose()
          }
          "SCCACHE_C_CUSTOM_CACHE_BUSTER=$fingerprint" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "fingerprint=$fingerprint" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Compiler cache identity: $fingerprint"

      - name: Configure S7 acceptance build
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            "-DDEPS_DIR=$env:COHAVORA_RESOLVED_DEPS_DIR" `
            "-DWEBRTC_ROOT=$env:COHAVORA_RESOLVED_DEPS_DIR/webrtc" `
            "-DTDESKTOP_LIBS_DIR=$env:COHAVORA_RESOLVED_DEPS_DIR/Libraries/win64" `
            -DCOHAVORA_BUILD_SAMPLES=OFF `
            -DCOHAVORA_BUILD_MEETING_APP=ON `
            -DBUILD_TESTING=ON `
            -DLIVEKIT_BUILD_EXTENDED_TESTS=OFF `
            -DLIVEKIT_BUILD_HARDWARE_TESTS=OFF `
            -DLIVEKIT_BUILD_EXTERNAL_TESTS=OFF `
            -DLIVEKIT_BUILD_RENDERER_RUNTIME_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build application and S7 acceptance targets
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR `
            --target cohavora_app test_telemetry_report test_participant_window_remediation `
            --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report compiler cache statistics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: sccache --show-stats

      - name: Verify S7 gate discovery
        shell: pwsh
        run: |
          $raw = (& ctest --test-dir $env:BUILD_DIR `
            -N -L TELEMETRY_S7_ACCEPTANCE --show-only=json-v1) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $discovery = $raw | ConvertFrom-Json
          $actual = @($discovery.tests | ForEach-Object { $_.name } | Sort-Object)
          $expected = @(
            'meeting_telemetry_s7_ui_100_test',
            'meeting_telemetry_s7_ui_150_test',
            'meeting_telemetry_s7_ui_200_test',
            'telemetry_report_test'
          ) | Sort-Object
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            Write-Error "Expected: $($expected -join ', '); actual: $($actual -join ', ')"
            throw "TELEMETRY_S7_ACCEPTANCE discovery mismatch; expected exactly $($expected.Count) tests."
          }

      - name: Run TELEMETRY_S7_ACCEPTANCE merge gate
        shell: pwsh
        run: |
          ctest --test-dir $env:BUILD_DIR `
            -L TELEMETRY_S7_ACCEPTANCE --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-s7-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 14
